<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="intro-screen">
        <div id="slideshow-container"></div>
    </div>
    <div id="black-overlay"></div>
    <audio id="intro-audio" loop src="sounds/suspenseful_music.mp3"></audio>

    <div id="confetti-container"></div>

    <audio id="bg-audio" loop src="sounds/quote_sound.mp3"></audio>

    <div class="content">
        <img src="assets/quote.png" alt="Quote Image" class="quote-image">
    </div>
    <script src="script.js"></script>
</body>
</html>
